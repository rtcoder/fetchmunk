[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "fetchmunk-backend"
version = "0.4.1"
requires-python = ">=3.13,<3.14"
dependencies = ["gallery-dl==1.32.17", "yt-dlp==2026.10.21", "cryptography==50.0.2", "keyring==25.7.0", "imageio-ffmpeg==0.6.0", "deno==2.9.8", "yt-dlp-ejs==0.8.0"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
