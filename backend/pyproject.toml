[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "fetchmunk-backend"
version = "0.3.0"
requires-python = ">=3.13,<3.14"
dependencies = ["gallery-dl==1.32.17"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
